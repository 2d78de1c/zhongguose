name: github_deploy

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Different commits/tags build independently. Duplicate events share a group;
# a repository-wide group would drop intermediate pending master pushes.
concurrency:
  group: github-deploy-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build portable static site
        run: npm run build -- --base ./
      - name: Assign version and publish release packages
        id: publish
        run: node scripts/github-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
